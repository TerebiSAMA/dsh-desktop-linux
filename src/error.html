<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>DSH Desktop</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif;
    }
    .card { text-align: center; max-width: 460px; padding: 40px; }
    h1 { font-size: 20px; margin-bottom: 12px; color: #4d6bfe; }
    p { font-size: 14px; line-height: 1.7; color: #8b949e; margin: 6px 0; }
    .btn {
      display: inline-block; margin-top: 20px; padding: 10px 24px;
      background: #4d6bfe; color: #fff; border: 0; border-radius: 8px;
      font-size: 14px; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: #3b55e0; }
    code { background: #161b22; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DSH Desktop</h1>
    <p>未能连接到 DeepSeek Harness Web 服务。</p>
    <p>服务地址：<code>http://127.0.0.1:3080</code></p>
    <p>请确认服务已启动：<code>systemctl --user status dsh-web</code></p>
    <a class="btn" href="#" onclick="location.reload()">重试</a>
  </div>
</body>
</html>
